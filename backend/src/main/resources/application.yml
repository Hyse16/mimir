spring:
  application:
    name: mimir-backend
  datasource:
    url: ${MIMIR_DB_URL:jdbc:postgresql://localhost:5432/mimir}
    username: ${MIMIR_DB_USER:mimir}
    password: ${MIMIR_DB_PASSWORD:mimir_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 305MB

mimir:
  storage:
    local-root: ${MIMIR_STORAGE_LOCAL_ROOT:./data/assets}
    max-image-bytes: ${MIMIR_MAX_IMAGE_BYTES:15728640}
  image:
    optimized-max-dimension: ${MIMIR_OPTIMIZED_IMAGE_MAX_DIMENSION:2048}
    analysis-max-dimension: ${MIMIR_ANALYSIS_IMAGE_MAX_DIMENSION:1280}
    optimized-jpeg-quality: ${MIMIR_OPTIMIZED_IMAGE_JPEG_QUALITY:0.85}
    analysis-jpeg-quality: ${MIMIR_ANALYSIS_IMAGE_JPEG_QUALITY:0.80}
    max-pixels: ${MIMIR_IMAGE_MAX_PIXELS:40000000}
  ai:
    vision-batch-size: ${MIMIR_VISION_BATCH_SIZE:3}
    ollama:
      base-url: ${MIMIR_OLLAMA_BASE_URL:http://127.0.0.1:11434}
      vision-model: ${MIMIR_OLLAMA_VISION_MODEL:gemma4:latest}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${MIMIR_BACKEND_PORT:8080}
